<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Glanceable Gesture HUD</title>
<link rel="stylesheet" href="../lab.css">
<style>
:root{
  --sky:#cfe2ee;--far:#a9bccb;--wallL:#e7d9c6;--wallL2:#d8c6ad;--wallR:#c9d3da;--wallR2:#b5c1ca;--win:#8fa6b6;--winLit:#8fa6b6;
  --walk:#d9d4cb;--road:#9b9a98;--stripe:#f1efe9;--tree:#6f9a72;--tree2:#5a845e;--awning:#c8553d;--pole:#4b4f55;
  --hud-bg:rgba(14,18,26,.58);--hud-ink:#f3f6ff;--hud-muted:rgba(225,232,250,.7);--hud-acc:#a9bcff;--hud-ok:#7fe0b0;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --sky:#1d2440;--far:#2a3150;--wallL:#3a3340;--wallL2:#2f2934;--wallR:#2c3242;--wallR2:#232838;--win:#262c3d;--winLit:#e9b86a;
  --walk:#3b3a40;--road:#2a2a2f;--stripe:#6c6b70;--tree:#2f4a3a;--tree2:#253c2f;--awning:#7c3a30;--pole:#15161a;
  --hud-bg:rgba(8,10,16,.6)}}
:root[data-theme="dark"]{
  --sky:#1d2440;--far:#2a3150;--wallL:#3a3340;--wallL2:#2f2934;--wallR:#2c3242;--wallR2:#232838;--win:#262c3d;--winLit:#e9b86a;
  --walk:#3b3a40;--road:#2a2a2f;--stripe:#6c6b70;--tree:#2f4a3a;--tree2:#253c2f;--awning:#7c3a30;--pole:#15161a;
  --hud-bg:rgba(8,10,16,.6)}
html,body{overflow:hidden}
::selection{background:color-mix(in srgb,var(--accent) 30%,transparent)}
.scene{position:fixed;inset:0;width:100%;height:100%;display:block}
.vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse 75% 70% at 50% 46%,transparent 60%,rgba(0,0,0,.28))}

/* Monocular HUD: one card at a time, in the right lens */
.hud{position:fixed;right:clamp(16px,13vw,180px);top:clamp(64px,19vh,150px);width:min(288px,calc(100vw - 32px));
  color:var(--hud-ink);font-size:14px;line-height:1.4;transform-origin:85% 15%;
  transition:opacity .25s var(--ease),scale .3s var(--ease),filter .25s}
.hud.off{opacity:0;scale:.6;filter:blur(6px);pointer-events:none;transition-timing-function:var(--exit)}
.hud-card{position:relative;background:var(--hud-bg);border-radius:18px;padding:14px 16px 12px;min-height:122px;
  -webkit-backdrop-filter:blur(10px) saturate(1.2);backdrop-filter:blur(10px) saturate(1.2);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.14),0 6px 24px rgba(0,0,0,.18);
  transition:box-shadow .18s var(--ease),scale .18s var(--ease)}
.hud-card.tap{scale:.975;box-shadow:inset 0 0 0 1.5px rgba(190,205,255,.75),0 6px 24px rgba(0,0,0,.18)}
.hud-body.in-l{animation:inL .26s var(--ease)}.hud-body.in-r{animation:inR .26s var(--ease)}.hud-body.in-f{animation:inF .22s var(--ease)}
@keyframes inL{from{opacity:0;translate:22px 0}}@keyframes inR{from{opacity:0;translate:-22px 0}}@keyframes inF{from{opacity:.2}}
.hud .top{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--hud-muted);margin-bottom:8px}
.hud .avatar{width:22px;height:22px;border-radius:50%;background:#c98bdb;color:#1b1020;font-weight:700;font-size:11px;display:grid;place-items:center;text-shadow:none}
.hud .row{display:flex;gap:12px;align-items:center}
.hud .row svg{flex:none;width:40px;height:40px;color:var(--hud-acc)}
.hud b{display:block;font-size:17px;line-height:1.25;font-weight:600}
.hud .dist{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--hud-acc)}
.hud p{margin:0;font-size:16px}
.hud .hint{margin-top:10px;font-size:12px;color:var(--hud-muted)}
.hud .opts{display:grid;gap:4px}
.hud .opt{padding:6px 10px;border-radius:10px;color:var(--hud-muted);transition:background-color .15s,color .15s}
.hud .opt.on{background:rgba(169,188,255,.22);color:var(--hud-ink);box-shadow:inset 0 0 0 1px rgba(169,188,255,.5)}
.hud .big{font-size:40px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.hud .big.paused{color:var(--hud-muted)}
.hud .bar{height:4px;border-radius:2px;background:rgba(255,255,255,.18);margin-top:8px;overflow:hidden}
.hud .bar i{display:block;height:100%;background:var(--hud-acc);transform-origin:left;transition:transform 1s linear}
.hud .sent{display:flex;gap:10px;align-items:center;color:var(--hud-ok);font-weight:600;font-size:16px}
.hud .sent svg{width:26px;height:26px}
.dots{display:flex;gap:6px;justify-content:center;margin-top:8px}
.dots i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.35);box-shadow:0 0 0 1px rgba(0,0,0,.15);transition:background-color .2s,scale .2s var(--spring)}
.dots i.on{background:#fff;scale:1.25}
.standby{position:fixed;width:8px;height:8px;border-radius:50%;background:rgba(220,230,255,.85);box-shadow:0 1px 3px rgba(0,0,0,.45);
  opacity:0;transition:opacity .3s var(--ease);pointer-events:none}
.standby.on{opacity:1}

/* Dock: wrist input indicator plus the on-screen gesture buttons */
.dock{position:fixed;left:24px;bottom:24px;display:flex;gap:12px;align-items:stretch;background:var(--surface);color:var(--ink);
  border-radius:var(--r-lg);padding:12px;box-shadow:var(--shadow);max-width:calc(100vw - 32px)}
.wrist{width:176px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;border-radius:var(--r-md);background:color-mix(in srgb,var(--ink) 5%,var(--surface));padding:8px 8px 10px}
.wrist svg{width:100%;height:auto;display:block}
.gname{font-size:12px;font-weight:600;color:var(--muted);min-height:18px;text-align:center;transition:color .15s}
.gname.live{color:var(--accent)}
.hand{fill:color-mix(in srgb,var(--ink) 16%,var(--surface));stroke:color-mix(in srgb,var(--ink) 45%,var(--surface));stroke-width:2.5;stroke-linejoin:round}
.finger{fill:none;stroke-linecap:round}
.finger.o{stroke:color-mix(in srgb,var(--ink) 45%,var(--surface))}
.finger.f{stroke:color-mix(in srgb,var(--ink) 16%,var(--surface))}
#thumb{transform-origin:95px 105px;transform-box:view-box;transition:transform .13s var(--ease)}
#thumb.pinch{transform:rotate(-33deg)}
#thumb.slide-a{transform:rotate(-30deg) translate(-9px,5px);transition-duration:.1s}
#thumb.slide-b{transform:rotate(-30deg) translate(11px,-6px);transition-duration:.2s}
.band{fill:var(--ink)}
.led{fill:color-mix(in srgb,var(--ink) 40%,var(--surface));transition:fill .12s}
.led.on{fill:var(--accent)}
.trail{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linecap:round;opacity:0;transition:opacity .15s}
.trail.on{opacity:.9}
.controls{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:8px;min-width:0}
.gbtn{border:0;border-radius:var(--r-sm);background:color-mix(in srgb,var(--ink) 6%,var(--surface));min-height:56px;padding:6px 12px;cursor:pointer;
  display:flex;flex-direction:column;align-items:flex-start;justify-content:center;text-align:left;min-width:0;transition:background-color .15s,scale .15s var(--ease)}
.gbtn:hover{background:color-mix(in srgb,var(--ink) 11%,var(--surface))}
.gbtn.press,.gbtn:active{scale:.96;background:color-mix(in srgb,var(--accent) 20%,var(--surface))}
.gbtn b{font-size:14px;font-weight:600}
.gbtn span{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
kbd{font:600 11px/1 inherit;font-family:inherit;padding:2px 6px;border-radius:5px;background:color-mix(in srgb,var(--ink) 9%,transparent);color:var(--muted);margin-left:4px}
@media (max-width:560px){
  .dock{left:12px;right:12px;bottom:max(12px,env(safe-area-inset-bottom));max-width:none;padding:10px;gap:10px}
  .wrist{width:112px}.gbtn{padding:6px 9px}.gbtn b{font-size:13px;white-space:nowrap}.gbtn kbd{display:none}
}
@media (max-height:520px){.gbtn{min-height:46px}.wrist{width:140px}}
</style>
</head>
<body>
<svg class="scene" id="scene" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice" aria-hidden="true"></svg>
<div class="vignette"></div>

<div class="hud" id="hud" role="region" aria-label="Glasses display" aria-live="polite">
  <div class="hud-card" id="card"><div class="hud-body" id="body"></div></div>
  <div class="dots" id="dots"><i></i><i></i><i></i></div>
</div>
<div class="standby" id="standby" aria-hidden="true"></div>

<div class="dock" role="group" aria-label="Wrist gestures">
  <div class="wrist" aria-hidden="true">
    <svg viewBox="0 0 200 150">
      <path class="hand" d="M-10 96 L62 82 L66 132 L-10 146Z"/>
      <rect class="band" x="52" y="78" width="20" height="60" rx="6" transform="rotate(-8 62 108)"/>
      <circle class="led" id="led1" cx="62" cy="96" r="2.6"/><circle class="led" id="led2" cx="63" cy="108" r="2.6"/><circle class="led" id="led3" cx="64" cy="120" r="2.6"/>
      <path class="hand" d="M74 78 C92 64 118 62 132 74 C142 84 144 110 132 124 C116 138 88 138 76 128Z"/>
      <path class="finger o" d="M120 76 L168 46" stroke-width="22"/><path class="finger f" d="M120 76 L168 46" stroke-width="17"/>
      <path class="finger o" d="M128 96 Q150 92 146 110" stroke-width="20"/><path class="finger f" d="M128 96 Q150 92 146 110" stroke-width="15"/>
      <path class="trail" id="trail" d="M126 56 L158 38"/>
      <g id="thumb"><path class="finger o" d="M95 105 L150 98" stroke-width="20"/><path class="finger f" d="M95 105 L150 98" stroke-width="15"/></g>
    </svg>
    <div class="gname" id="gname">Ready</div>
  </div>
  <div class="controls">
    <button class="gbtn" id="bPinch"><b>Pinch</b><span>Select <kbd>Space</kbd></span></button>
    <button class="gbtn" id="bDouble"><b>Double pinch</b><span>Dismiss <kbd>Esc</kbd></span></button>
    <button class="gbtn" id="bPrev"><b>Swipe right</b><span>Previous <kbd>Left</kbd></span></button>
    <button class="gbtn" id="bNext"><b>Swipe left</b><span>Next <kbd>Right</kbd></span></button>
  </div>
</div>

<script>
(() => {
const $ = s => document.querySelector(s);
const reduced = matchMedia('(prefers-reduced-motion: reduce)');

/* ---------- Scene: a first-person street, drawn in one-point perspective ---------- */
(function drawScene(){
  const VX = 800, VY = 470;
  const lerp = (a, b, t) => a + (b - a) * t;
  // A point on a wall plane: u runs from the viewer (0) toward the vanishing point (1), v from bottom (0) to top (1)
  const wallPt = (side, u, v) => {
    const xNear = side < 0 ? 0 : 1600, xFar = side < 0 ? 640 : 960;
    const x = lerp(xNear, xFar, u), yb = lerp(900, 560, u), yt = lerp(-80, 330, u);
    return [x, lerp(yb, yt, v)];
  };
  const quad = (side, u0, u1, v0, v1) => [wallPt(side,u0,v0), wallPt(side,u1,v0), wallPt(side,u1,v1), wallPt(side,u0,v1)].map(p => p.map(n => n.toFixed(1)).join(',')).join(' ');
  let s = `<rect width="1600" height="1000" fill="var(--sky)"/>
    <path d="M560 330 L560 250 L620 250 L620 200 L700 200 L700 270 L760 270 L760 230 L850 230 L850 280 L900 280 L900 210 L980 210 L980 260 L1040 260 L1040 330Z" fill="var(--far)"/>
    <rect x="640" y="330" width="320" height="230" fill="var(--wallR2)"/>`;
  for (let r = 0; r < 3; r++) for (let c = 0; c < 6; c++)
    s += `<rect x="${660 + c*50}" y="${350 + r*58}" width="30" height="36" rx="2" fill="${(r*6+c) % 4 === 1 ? 'var(--winLit)' : 'var(--win)'}"/>`;
  s += `<polygon points="0,900 640,560 700,560 250,1000 0,1000" fill="var(--walk)"/>
    <polygon points="700,560 900,560 1350,1000 250,1000" fill="var(--road)"/>
    <polygon points="900,560 960,560 1600,900 1600,1000 1350,1000" fill="var(--walk)"/>
    <polygon points="${quad(-1,0,1,0,1)}" fill="var(--wallL)"/>
    <polygon points="${quad(1,0,1,0,1)}" fill="var(--wallR)"/>`;
  // Windows: rows and columns that shrink with depth
  const cols = [.04,.2,.33,.44,.53,.61,.68,.74,.79,.835,.875];
  [-1, 1].forEach(side => cols.forEach((u, i) => {
    const w = (cols[i+1] || .91) - u;
    [.5, .72].forEach((v, j) => { if (side < 0 && v === .5 && i < 3) return;
      s += `<polygon points="${quad(side, u + w*.18, u + w*.78, v, v + .14)}" fill="${(i + j + (side > 0 ? 1 : 0)) % 3 === 0 ? 'var(--winLit)' : 'var(--win)'}"/>`; });
  }));
  // Shopfront and awning on the left
  s += `<polygon points="${quad(-1,.02,.3,.04,.36)}" fill="var(--wallL2)"/>
    <polygon points="${quad(-1,.0,.32,.36,.44)}" fill="var(--awning)"/>
    <polygon points="${quad(-1,.06,.26,.06,.3)}" fill="var(--win)"/>`;
  // Crossing stripes
  for (let i = 0; i < 7; i++){
    const y0 = 760, y1 = 812, t0 = (y0 - 560) / 440, t1 = (y1 - 560) / 440;
    const xl0 = lerp(700, 250, t0), xr0 = lerp(900, 1350, t0), xl1 = lerp(700, 250, t1), xr1 = lerp(900, 1350, t1);
    const a = i / 7 + .02, b = (i + .55) / 7;
    s += `<polygon points="${lerp(xl0,xr0,a)},${y0} ${lerp(xl0,xr0,b)},${y0} ${lerp(xl1,xr1,b)},${y1} ${lerp(xl1,xr1,a)},${y1}" fill="var(--stripe)"/>`;
  }
  // Lamp posts and trees on the right pavement, receding
  [[.18,1],[.5,.55],[.72,.34]].forEach(([u, k]) => {
    const x = lerp(1450, 935, u), y = lerp(925, 568, u);
    s += `<rect x="${x - 4*k}" y="${y - 330*k}" width="${8*k}" height="${330*k}" fill="var(--pole)"/><rect x="${x - 26*k}" y="${y - 336*k}" width="${40*k}" height="${10*k}" rx="${4*k}" fill="var(--pole)"/>`;
  });
  [[.3,.85],[.62,.45]].forEach(([u, k]) => {
    const x = lerp(1500, 940, u) - 70*k, y = lerp(930, 568, u);
    s += `<rect x="${x - 6*k}" y="${y - 160*k}" width="${12*k}" height="${160*k}" fill="var(--pole)"/>
      <circle cx="${x}" cy="${y - 210*k}" r="${90*k}" fill="var(--tree)"/><circle cx="${x + 50*k}" cy="${y - 170*k}" r="${62*k}" fill="var(--tree2)"/><circle cx="${x - 55*k}" cy="${y - 180*k}" r="${58*k}" fill="var(--tree2)"/>`;
  });
  $('#scene').innerHTML = s;
})();

/* ---------- HUD state ---------- */
const STEPS = [
  {icon:'up', text:'Head north on Calder Street', dist:'180 m'},
  {icon:'left', text:'Turn left onto Wren Lane', dist:'80 m'},
  {icon:'pin', text:'Halden Café is on your right', dist:'20 m'},
];
const REPLIES = ['On my way in 5', 'Take your time', 'I\'ll order for us'];
const ICONS = {
  up:'<path d="M20 34V8M10 18L20 8l10 10" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>',
  left:'<path d="M28 36V20a6 6 0 00-6-6H8M15 7L8 14l7 7" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>',
  pin:'<path d="M20 36s-11-9-11-18a11 11 0 1122 0c0 9-11 18-11 18z" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linejoin="round"/><circle cx="20" cy="18" r="4" fill="currentColor"/>',
};
const st = {card:0, step:0, msg:'idle', reply:0, sentText:'', timer:402, running:true, off:false};
const hud = $('#hud'), card = $('#card'), body = $('#body'), dots = [...document.querySelectorAll('#dots i')];
const fmt = s => Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');

function render(enter){
  let h = '';
  if (st.card === 0){
    const s = STEPS[st.step];
    h = `<div class="top">Walking · Halden Café · ${6 - st.step * 2} min</div>
      <div class="row"><svg viewBox="0 0 40 40">${ICONS[s.icon]}</svg><div><span class="dist">${s.dist}</span><b>${s.text}</b></div></div>
      <div class="hint">Pinch for the next step</div>`;
  } else if (st.card === 1){
    if (st.msg === 'idle') h = `<div class="top"><span class="avatar">P</span>Priya · now</div><p>Running 5 min late. Can you grab us a table?</p><div class="hint">Pinch to reply</div>`;
    else if (st.msg === 'reply') h = `<div class="top">Reply to Priya</div><div class="opts">${REPLIES.map((r, i) => `<div class="opt${i === st.reply ? ' on' : ''}">${r}</div>`).join('')}</div><div class="hint">Swipe to choose · pinch to send</div>`;
    else h = `<div class="top"><span class="avatar">P</span>Priya</div><div class="sent"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>Sent</div><p style="margin-top:6px">“${st.sentText}”</p>`;
  } else {
    h = `<div class="top">Timer · Pasta</div><div class="big${st.running ? '' : ' paused'}" id="tleft">${fmt(st.timer)}</div>
      <div class="bar"><i id="tbar" style="transform:scaleX(${st.timer / 540})"></i></div><div class="hint">${st.running ? 'Pinch to pause' : 'Paused · pinch to resume'}</div>`;
  }
  body.innerHTML = h;
  dots.forEach((d, i) => d.classList.toggle('on', i === st.card));
  if (enter){ body.className = 'hud-body'; void body.offsetWidth; body.className = 'hud-body in-' + enter; }
}
function flash(){ card.classList.add('tap'); setTimeout(() => card.classList.remove('tap'), 160); }
function placeStandby(){
  const r = hud.getBoundingClientRect(), sb = $('#standby');
  sb.style.left = (r.right - 14) + 'px'; sb.style.top = (r.top + 6) + 'px';
}
function setOff(on){ st.off = on; hud.classList.toggle('off', on); placeStandby(); $('#standby').classList.toggle('on', on); }

let sentTimer = 0;
const actions = {
  pinch(){
    if (st.off){ setOff(false); render('f'); return; }
    flash();
    if (st.card === 0){ st.step = (st.step + 1) % STEPS.length; render('l'); }
    else if (st.card === 1){
      if (st.msg === 'idle'){ st.msg = 'reply'; render('f'); }
      else if (st.msg === 'reply'){ st.msg = 'sent'; st.sentText = REPLIES[st.reply]; render('f');
        clearTimeout(sentTimer); sentTimer = setTimeout(() => { if (st.msg === 'sent'){ st.msg = 'idle'; if (st.card === 1 && !st.off) render('f'); } }, 4000); }
      else { st.msg = 'idle'; render('f'); }
    } else { st.running = !st.running; render(); }
  },
  next(){ move(1); }, prev(){ move(-1); },
  double(){
    if (st.off) return;
    if (st.card === 1 && st.msg === 'reply'){ st.msg = 'idle'; flash(); render('f'); return; }
    setOff(true);
  },
};
function move(d){
  if (st.off){ setOff(false); render('f'); return; }
  if (st.card === 1 && st.msg === 'reply'){ st.reply = (st.reply + d + REPLIES.length) % REPLIES.length; render(); return; }
  st.card = (st.card + d + 3) % 3; render(d > 0 ? 'l' : 'r');
}
setInterval(() => {
  if (!st.running || st.timer <= 0) return;
  st.timer--; const t = $('#tleft'); if (t){ t.textContent = fmt(st.timer); $('#tbar').style.transform = `scaleX(${st.timer / 540})`; }
}, 1000);

/* ---------- Wrist indicator: the hand performs the gesture, the band's sensors light ---------- */
const thumb = $('#thumb'), gname = $('#gname'), trail = $('#trail'), leds = ['#led1','#led2','#led3'].map(s => $(s));
const NAMES = {pinch:'Pinch · select', double:'Double pinch · dismiss', next:'Swipe left · next', prev:'Swipe right · previous'};
let handTimers = [];
const later = (fn, ms) => handTimers.push(setTimeout(fn, ms));
function animateHand(g){
  handTimers.forEach(clearTimeout); handTimers = [];
  const slow = reduced.matches ? 2.2 : 1;
  thumb.setAttribute('class', ''); trail.classList.remove('on');
  gname.textContent = NAMES[g]; gname.classList.add('live');
  leds.forEach((l, i) => { later(() => l.classList.add('on'), i * 40); later(() => l.classList.remove('on'), 260 + i * 40); });
  if (g === 'pinch'){ thumb.setAttribute('class', 'pinch'); later(() => thumb.setAttribute('class', ''), 170 * slow); }
  if (g === 'double'){ thumb.setAttribute('class', 'pinch'); later(() => thumb.setAttribute('class', ''), 140 * slow); later(() => thumb.setAttribute('class', 'pinch'), 280 * slow); later(() => thumb.setAttribute('class', ''), 420 * slow); }
  if (g === 'next' || g === 'prev'){
    const [a, b] = g === 'next' ? ['slide-b', 'slide-a'] : ['slide-a', 'slide-b'];
    thumb.setAttribute('class', a); trail.setAttribute('d', g === 'next' ? 'M158 38 L126 56' : 'M126 56 L158 38');
    later(() => { thumb.setAttribute('class', b); trail.classList.add('on'); }, 110 * slow);
    later(() => { thumb.setAttribute('class', ''); trail.classList.remove('on'); }, 360 * slow);
  }
  later(() => gname.classList.remove('live'), 900);
}
const BTN = {pinch:$('#bPinch'), double:$('#bDouble'), next:$('#bNext'), prev:$('#bPrev')};
function gesture(g){ animateHand(g); actions[g](); }
Object.entries(BTN).forEach(([g, b]) => b.addEventListener('click', () => gesture(g)));
addEventListener('keydown', e => {
  if (e.target.closest('button') && (e.key === ' ' || e.key === 'Enter')) return; // the focused button handles itself
  const g = {' ':'pinch', Enter:'pinch', ArrowRight:'next', ArrowLeft:'prev', Escape:'double', Backspace:'double'}[e.key];
  if (!g || e.repeat) return; e.preventDefault();
  BTN[g].classList.add('press'); setTimeout(() => BTN[g].classList.remove('press'), 140); gesture(g);
});
addEventListener('resize', placeStandby);

/* ---------- Autoplay: directions, then reply to a message by swipe and pinch, then dismiss ---------- */
let auto = new URLSearchParams(location.search).has('autoplay'), token = 0;
const wait = ms => new Promise((res, rej) => { const t = token; setTimeout(() => t === token && auto ? res() : rej('stopped'), ms); });
function stopAuto(){ if (!auto) return; auto = false; token++; }
['pointerdown','keydown','wheel','touchstart'].forEach(t => addEventListener(t, e => { if (e.isTrusted) stopAuto(); }, {capture:true, passive:true}));
async function act(g, after){ BTN[g].classList.add('press'); gesture(g); await wait(150); BTN[g].classList.remove('press'); await wait(after); }
function reset(){ Object.assign(st, {card:0, step:0, msg:'idle', reply:0, timer:402, running:true}); clearTimeout(sentTimer); setOff(false); render('f'); gname.textContent = 'Ready'; }
async function script(){
  await wait(1400);
  await act('pinch', 1700);           // next walking step
  await act('pinch', 1500);           // arriving
  await act('next', 1500);            // to the message
  await act('pinch', 1200);           // open replies
  await act('next', 800);
  await act('next', 900);
  await act('prev', 1000);            // settle on "Take your time"
  await act('pinch', 1900);           // send
  await act('next', 1700);            // timer
  await act('double', 1600);          // dismiss
}
async function run(){ while (auto){ try { reset(); await script(); await wait(2000); } catch { return; } } }

render(); placeStandby();
if (auto) run();
})();
</script>
